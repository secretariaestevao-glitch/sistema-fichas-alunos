<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Fichas do Aluno - E.M.T.I Estevão Alves da Rocha</title>

  <!-- Biblioteca do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h1, h2 { color: #1a365d; }
    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #2b6cb0; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #2c5282; }
    .btn-danger { background-color: #c53030; }
    .btn-danger:hover { background-color: #9b2c2c; }
    #login-screen { max-width: 400px; margin: 100px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .aluno-card { background: #fff; border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen">
    <h2>Login do Sistema</h2>
    <input type="text" id="login-cpf" placeholder="Digite seu CPF">
    <input type="password" id="login-senha" placeholder="Digite sua senha">
    <button onclick="fazerLogin()">Entrar</button>
    <p id="login-error" style="color: red; font-size: 14px;"></p>
  </div>

  <!-- TELA DO SISTEMA PRINCIPAL -->
  <div id="sistema-container" class="container" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1>Sistema de Fichas do Aluno</h1>
        <p>E.M.T.I Estevão Alves da Rocha - Baturité/CE</p>
      </div>
      <button onclick="fazerLogout()" class="btn-danger" style="width: auto; padding: 8px 16px;">Sair</button>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- SEÇÃO DE IMPORTAÇÃO EM LOTE -->
    <div>
      <h3>Atualizar lista de alunos (em lote)</h3>
      <p style="font-size: 13px; color: #666;">Cole a lista abaixo no formato <code>Nome;Série;Turma</code> (um aluno por linha).</p>
      <textarea id="importar-texto" rows="6" placeholder="Ex:&#10;JOÃO DA SILVA SOUZA;5º Ano;A&#10;MARIA EDUARDA LIMA;5º Ano;A"></textarea>
      <button id="btn-importar-lista">Importar / atualizar lista</button>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- SEÇÃO DE LISTAGEM DE ALUNOS -->
    <div>
      <h3>Alunos Cadastrados</h3>
      <input type="text" id="busca-aluno" placeholder="Buscar aluno pelo nome..." oninput="filtrarAlunos()">
      <div id="lista-alunos-container" style="margin-top: 15px;">
        <!-- Os alunos importados aparecerão aqui automaticamente -->
      </div>
    </div>
  </div>

  <!-- SCRIPT GERAL DO SISTEMA -->
  <script>
    const SUPABASE_URL = 'https://pqpqhklitnnilukjailn.supabase.co';
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_AQUI'; // Substitua pela sua chave anon real se necessário
    
    let supabaseClient = null;
    try {
      if (typeof supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        console.error('A biblioteca do Supabase não foi carregada.');
      }
    } catch (e) {
      console.error('Erro ao inicializar o Supabase:', e);
    }

    // FUNÇÃO DE LOGIN
    async function fazerLogin() {
      const cpfInput = document.getElementById('login-cpf');
      const senhaInput = document.getElementById('login-senha');
      const erroEl = document.getElementById('login-error');

      if (!cpfInput || !senhaInput || !erroEl) return;

      const cpf = cpfInput.value.trim();
      const senha = senhaInput.value.trim();

      erroEl.innerText = '';

      if (!cpf || !senha) {
        erroEl.innerText = 'Preencha o CPF e a senha.';
        return;
      }

      if (!supabaseClient) {
        erroEl.innerText = 'Erro de conexão com o Supabase.';
        return;
      }

      const emailFicticio = cpf + '@escola.com';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: emailFicticio,
          password: senha
        });

        if (error) {
          erroEl.innerText = 'CPF ou senha incorretos.';
          return;
        }

        if (data && data.session) {
          liberarSistema();
        } else {
          erroEl.innerText = 'Não foi possível iniciar a sessão.';
        }
      } catch (err) {
        erroEl.innerText = 'Ocorreu um erro ao tentar conectar.';
      }
    }

    // FUNÇÃO DE LOGOUT
    async function fazerLogout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      location.reload();
    }

    // MOSTRAR O SISTEMA E OCULTAR LOGIN
    function liberarSistema() {
      const loginScreen = document.getElementById('login-screen');
      const sistemaContainer = document.getElementById('sistema-container');
      
      if (loginScreen) loginScreen.style.display = 'none';
      if (sistemaContainer) sistemaContainer.style.display = 'block';

      carregarAlunosNaTela();
    }

    // VERIFICAR SESSÃO ATIVA AO ABRIR A PÁGINA
    if (supabaseClient) {
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          liberarSistema();
        }
      }).catch(err => {
        console.error('Erro ao verificar sessão:', err);
      });
    }

    // RENDERIZAR E EXIBIR ALUNOS NA TELA
    function carregarAlunosNaTela(filtro = '') {
      const container = document.getElementById('lista-alunos-container');
      if (!container) return;

      const dadosSalvos = localStorage.getItem('alunos_cadastrados');
      if (!dadosSalvos) {
        container.innerHTML = '<p style="color: #666;">Nenhum aluno cadastrado ou importado ainda.</p>';
        return;
      }

      const alunos = JSON.parse(dadosSalvos);
      container.innerHTML = '';

      const alunosFiltrados = alunos.filter(a => a.nome.toLowerCase().includes(filtro.toLowerCase()));

      if (alunosFiltrados.length === 0) {
        container.innerHTML = '<p style="color: #666;">Nenhum aluno encontrado com esse nome.</p>';
        return;
      }

      alunosFiltrados.forEach(aluno => {
        const card = document.createElement('div');
        card.className = 'aluno-card';
        card.innerHTML = `
          <div>
            <strong>${aluno.nome}</strong><br>
            <span style="font-size: 13px; color: #666;">Série: ${aluno.serie} | Turma: ${aluno.turma}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filtrarAlunos() {
      const termo = document.getElementById('busca-aluno').value;
      carregarAlunosNaTela(termo);
    }

    // SCRIPT DE IMPORTAÇÃO EM LOTE
    document.addEventListener('DOMContentLoaded', () => {
      const btnImportar = document.getElementById('btn-importar-lista');
      if (btnImportar) {
        btnImportar.addEventListener('click', function() {
          const textarea = document.getElementById('importar-texto');
          if (!textarea) return;

          const texto = textarea.value.trim();
          if (!texto) {
            alert('Cole a lista de alunos antes de importar.');
            return;
          }

          const linhas = texto.split('\n');
          let listaAlunos = [];

          linhas.forEach(linha => {
            if (!linha.trim()) return;
            const partes = linha.split(';');
            if (partes.length >= 3) {
              listaAlunos.push({
                nome: partes[0].trim(),
                serie: partes[1].trim(),
                turma: partes[2].trim()
              });
            }
          });

          if (listaAlunos.length > 0) {
            localStorage.setItem('alunos_cadastrados', JSON.stringify(listaAlunos));
            alert(listaAlunos.length + ' alunos importados com sucesso!');
            carregarAlunosNaTela();
            textarea.value = '';
          } else {
            alert('Nenhum aluno válido encontrado. Verifique se o formato está estritamente como Nome;Série;Turma.');
          }
        });
      }
    });
  </script>
</body>
</html>
